<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5831E0" />
  <title>Hors ligne — TutorSphere</title>
  <style>
    :root {
      --ts-primary: #5831E0;
      --ts-navy: #1e1b4b;
      --ts-bg: #f4f2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, var(--ts-bg) 0%, #e8e4ff 100%);
      color: var(--ts-navy);
      padding: 1.5rem;
    }
    .card {
      max-width: 26rem;
      width: 100%;
      background: #fff;
      border-radius: 1rem;
      padding: 2rem 1.75rem;
      box-shadow: 0 12px 40px rgba(30, 27, 75, 0.12);
      text-align: center;
    }
    .mark {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: var(--ts-primary);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.35rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
      font-weight: 700;
    }
    p {
      margin: 0 0 1.5rem;
      color: #4b5563;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    a.btn {
      display: inline-block;
      text-decoration: none;
      background: var(--ts-primary);
      color: #fff;
      font-weight: 600;
      padding: 0.7rem 1.25rem;
      border-radius: 0.65rem;
    }
    a.btn:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">TS</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Reconnectez-vous à Internet pour utiliser TutorSphere. L’application nécessite un réseau pour les cours, la messagerie et la connexion.</p>
    <a class="btn" href="/">Réessayer</a>
  </main>
</body>
</html>
